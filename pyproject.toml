[project]
name = "ai-agents-from-zero"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ProkingDu", email = "2811051813@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "black>=24.0",
    "dashscope>=1.0",
    "docx2txt>=0.8",
    "grandalf>=0.6",
    "httpx>=0.27",
    "jq>=1.6",
    "langchain>=1.2,<2",
    "langchain-classic>=1.0",
    "langchain-community>=0.3,<1",
    "langchain-core>=1.2,<2",
    "langchain-deepseek>=0.1",
    "langchain-mcp-adapters>=0.2",
    "langchain-ollama>=0.2",
    "langchain-openai>=1.1,<2",
    "langchain-redis>=0.2",
    "langchain-unstructured>=1.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0,<4",
    "langgraph-supervisor>=0.0.20,<1",
    "loguru>=0.7",
    "markdown>=3.4",
    "mcp>=1.0",
    "openai>=1.0,<3",
    "pydantic>=2.7,<3",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "python-dotenv>=1.0",
    "redis>=5.3,<6",
    "unstructured>=0.10",
]

[project.scripts]
ai-agents-from-zero = "ai_agents_from_zero:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
